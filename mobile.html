<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Mobile viewport: viewport-fit=cover lets us paint into the iPhone notch
     and home-indicator areas; we use env(safe-area-inset-*) in CSS to keep
     content out of those regions. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Cache-control. The same kill-switch service worker logic from desktop is
     here too in case any prior PWA install registered a worker that's still
     hanging around in the browser. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- iOS PWA support: when user taps "Add to Home Screen" in Safari, these
     tags make the launched app feel native — full-screen, custom title,
     translucent status bar over our dark theme. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StormLab">
<meta name="theme-color" content="#0a0e14">
<!-- Apple touch icon — a small SVG of an amber radar dish on dark, embedded
     as a data URI so the home-screen install doesn't need a separate file. -->
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'&gt;&lt;rect width='180' height='180' fill='%230a0e14'/&gt;&lt;circle cx='90' cy='90' r='70' fill='none' stroke='%23f59e0b' stroke-width='4'/&gt;&lt;circle cx='90' cy='90' r='45' fill='none' stroke='%23f59e0b' stroke-width='3' stroke-opacity='0.6'/&gt;&lt;circle cx='90' cy='90' r='20' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-opacity='0.4'/&gt;&lt;line x1='90' y1='20' x2='90' y2='160' stroke='%23f59e0b' stroke-width='2' stroke-opacity='0.5'/&gt;&lt;line x1='20' y1='90' x2='160' y2='90' stroke='%23f59e0b' stroke-width='2' stroke-opacity='0.5'/&gt;&lt;circle cx='90' cy='90' r='6' fill='%23f59e0b'/&gt;&lt;/svg&gt;">
<!-- Service worker kill switch — same approach as desktop. Cleans up any
     leftover workers that might intercept network requests and serve stale
     content. Safe even when no worker is registered. -->
<script>
(function killServiceWorkers() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(regs => { regs.forEach(r => r.unregister()); })
      .catch(()=>{});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(()=>{});
  }
})();
</script>
<title>StormLab Mobile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e14;
  --bg-raised: #141a23;
  --bg-hover: #1c2430;
  --border: #232d3b;
  --border-bright: #36465c;
  --text: #e6edf3;
  --text-dim: #8b96a3;
  --text-faint: #5a6573;
  --amber: #f59e0b;
  --amber-dim: #b8770a;
  --red: #ef4444;
  --orange: #f97316;
  --yellow: #eab308;
  --green: #22c55e;
  --cyan: #22d3ee;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  /* Safe-area insets for iPhone notch/home-indicator. Fall back to 0 for
     non-iOS browsers where the env() function isn't applicable. */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; }

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
}

/* TOPBAR — minimal, just brand + version + alert count badge */
#topbar {
  flex: 0 0 auto;
  height: 52px;
  padding: 0 12px;
  padding-top: var(--safe-top);
  height: calc(52px + var(--safe-top));
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 1000;
}
#topbar-left { display: flex; align-items: center; gap: 8px; }
#brand {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.05em;
  color: var(--amber);
}
#version-pill {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
}
#topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
#local-time {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
}

/* MAP — fills available space between topbar and bottom sheet */
#map {
  flex: 1 1 auto;
  min-height: 0;
  background: var(--bg);
  position: relative;
}

/* RADAR ANIMATION CONTROL — bottom-left of map, fixed position over the map */
#radar-controls {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(20, 26, 35, 0.92);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 500;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
#radar-controls.hidden { display: none; }
.icon-btn {
  width: 36px;
  height: 36px;
  background: transparent;
  border: 1px solid var(--border-bright);
  border-radius: 6px;
  color: var(--amber);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
}
.icon-btn:active { background: rgba(245, 158, 11, 0.15); }
#radar-time {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  min-width: 60px;
  text-align: center;
}

/* AUDIO ENABLE PROMPT — first-load overlay for iOS audio policy */
#audio-prompt {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-raised);
  border: 1px solid var(--amber);
  border-radius: 8px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 600;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#audio-prompt.hidden { display: none; }
#audio-prompt-text {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--amber);
}

/* BOTTOM SHEET — alerts list, slides up to expand */
#alerts-sheet {
  flex: 0 0 auto;
  background: var(--bg-raised);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  max-height: 60vh;
  display: flex;
  flex-direction: column;
  transition: max-height 0.25s ease;
}
#alerts-sheet.collapsed {
  max-height: calc(56px + var(--safe-bottom));
}

#alerts-header {
  flex: 0 0 auto;
  height: 56px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
#alerts-header-left { display: flex; align-items: center; gap: 10px; }
.alerts-count-badge {
  background: var(--amber);
  color: var(--bg);
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  padding: 3px 9px;
  border-radius: 12px;
  min-width: 28px;
  text-align: center;
}
.alerts-count-badge.zero { background: var(--border-bright); color: var(--text-dim); }
.alerts-count-badge.urgent { background: var(--red); color: white; }
#alerts-label {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.05em;
  color: var(--text);
}
#alerts-chevron {
  font-size: 18px;
  color: var(--text-faint);
  transition: transform 0.25s ease;
}
#alerts-sheet:not(.collapsed) #alerts-chevron { transform: rotate(180deg); }

#alerts-list {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 12px 12px 12px;
}
.alert-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.alert-card:active { background: var(--bg-hover); }
.alert-card .alert-event {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--text);
  margin-bottom: 4px;
}
.alert-card .alert-area {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
  line-height: 1.4;
}
.alert-card .alert-time {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
}
.alert-card.severity-extreme { border-left-color: #dc2626; }
.alert-card.severity-severe   { border-left-color: var(--red); }
.alert-card.severity-moderate { border-left-color: var(--orange); }
.alert-card.severity-minor    { border-left-color: var(--yellow); }
.alert-card.severity-unknown  { border-left-color: var(--text-faint); }
.alert-empty {
  padding: 20px 12px;
  text-align: center;
  color: var(--text-faint);
  font-family: var(--mono);
  font-size: 11px;
}

/* DESKTOP LINK — small unobtrusive link to switch to desktop view */
#desktop-link {
  position: absolute;
  top: 12px;
  right: 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
  text-decoration: none;
  background: rgba(20, 26, 35, 0.85);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  z-index: 500;
}
#desktop-link:active { color: var(--amber); }

/* TOAST — transient feedback */
#toast {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-raised);
  border: 1px solid var(--border-bright);
  border-radius: 6px;
  padding: 10px 16px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  max-width: 80vw;
  text-align: center;
}
#toast.show { opacity: 1; }

/* Leaflet overrides for dark theme */
.leaflet-container { background: var(--bg); }
.leaflet-control-zoom a {
  background: var(--bg-raised) !important;
  color: var(--amber) !important;
  border-color: var(--border) !important;
}
.leaflet-control-attribution {
  background: rgba(10, 14, 20, 0.7) !important;
  color: var(--text-faint) !important;
  font-size: 9px !important;
}
.leaflet-control-attribution a { color: var(--text-dim) !important; }

/* User location dot */
.user-location-dot {
  width: 14px;
  height: 14px;
  background: var(--amber);
  border: 2px solid white;
  border-radius: 50%;
  box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.25);
}
</style>
</head>

<div id="app">
  <!-- TOPBAR -->
  <div id="topbar">
    <div id="topbar-left">
      <span id="brand">STORMLAB</span>
      <span id="version-pill">v.1m</span>
    </div>
    <div id="topbar-right">
      <span id="local-time">—:—</span>

  <div id="map">
    <div id="audio-prompt" class="hidden">

    <div id="alerts-list">

    </div>
  </div>
</div>

<div id="toast"></div>

// ─── Toast helper ───────────────────────────────────────────────────
let toastTimer = null;
function toast(msg, durationMs) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), durationMs || 2500);
}

// ─── Local time clock ───────────────────────────────────────────────
function tickClock() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  $("local-time").textContent = `${hh}:${mm}`;
}
tickClock();
setInterval(tickClock, 30 * 1000);

// ─── Map setup ──────────────────────────────────────────────────────

}).setView(DEFAULT_CENTER, DEFAULT_ZOOM);

// Dark CartoDB basemap — same as desktop for visual consistency.

  subdomains: "abcd",

// Cedar Hill outline — cosmetic only on mobile (not used for any

L.geoJSON({

}, {

    weight: 2,
    opacity: 0.9,
    fillColor: "#22d3ee",
    fillOpacity: 0.05
  },
  interactive: false
}).addTo(map);

// User location dot — uses HTML5 geolocation. Asks for permission once;
// updates as the device moves. Failures are silent so users without
// location services enabled aren't pestered.
let userLocationMarker = null;
function tryUserLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    (pos) => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (userLocationMarker) {
        userLocationMarker.setLatLng(ll);
      } else {
        const icon = L.divIcon({
          className: "",
          html: '<div class="user-location-dot"></div>',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });
        userLocationMarker = L.marker(ll, { icon, interactive: false }).addTo(map);
      }
    },
    (err) => { /* silent */ },
    { enableHighAccuracy: false, maximumAge: 60000, timeout: 30000 }
  );
}
tryUserLocation();

// ─── Radar layer (NEXRAD via Iowa Mesonet) ──────────────────────────
// Animation has 6 frames at ~10-min intervals (60 min of history).
// Less than the desktop's 10 frames to keep the data load lighter on
// mobile and the animation snappier on slower connections.
const RADAR_FRAME_COUNT = 6;
const RADAR_FRAME_INTERVAL_MIN = 10;
const RADAR_PLAY_INTERVAL_MS = 700;
const radar = {
  frames: [],            // L.tileLayer instances, one per frame
  currentIndex: 0,
  playing: false,
  playTimer: null,
  hasLoaded: false
};

// Round a date to the most recent N-minute boundary (e.g. 10-min).
// Iowa Mesonet RIDGE archive serves frames at 5-min cadence so we
// snap to a multiple of 5 and step backwards.
function radarTimestamps() {
  const stamps = [];
  const now = new Date();
  const ms = 5 * 60 * 1000;
  let t = Math.floor(now.getTime() / ms) * ms;
  // Skip the most recent frame (often not yet rendered server-side)
  // and start from one frame behind for reliability.
  t -= ms;
  for (let i = 0; i < RADAR_FRAME_COUNT; i++) {
    stamps.unshift(new Date(t));
    t -= RADAR_FRAME_INTERVAL_MIN * 60 * 1000;
  }
  return stamps;
}

function buildRadarFrames() {
  // Tear down any existing frames before rebuilding
  for (const f of radar.frames) {
    try { map.removeLayer(f); } catch(_) {}
  }
  radar.frames = [];
  const stamps = radarTimestamps();
  stamps.forEach((dt, i) => {
    const yyyy = dt.getUTCFullYear();
    const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
    const dd = String(dt.getUTCDate()).padStart(2, "0");
    const HH = String(dt.getUTCHours()).padStart(2, "0");
    const MM = String(dt.getUTCMinutes()).padStart(2, "0");
    const stamp = `${yyyy}${mm}${dd}${HH}${MM}`;
    const url = `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/ridge::USCOMP-N0Q-${stamp}/{z}/{x}/{y}.png`;
    const layer = L.tileLayer(url, {
      opacity: i === stamps.length - 1 ? 0.7 : 0,
      zIndex: 200 + i,
      maxZoom: 18,
      attribution: "NEXRAD via Iowa Mesonet"
    });
    layer._stampDate = dt;
    radar.frames.push(layer);
    layer.addTo(map);
  });
  radar.currentIndex = stamps.length - 1;
  updateRadarTimeLabel();
  $("radar-controls").classList.remove("hidden");
  radar.hasLoaded = true;
}

function updateRadarTimeLabel() {
  const layer = radar.frames[radar.currentIndex];
  if (!layer || !layer._stampDate) return;
  const d = layer._stampDate;
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const isCurrent = radar.currentIndex === radar.frames.length - 1;
  $("radar-time").textContent = isCurrent ? `${hh}:${mm} now` : `${hh}:${mm}`;
}

function showRadarFrame(idx) {
  radar.frames.forEach((f, i) => f.setOpacity(i === idx ? 0.7 : 0));
  radar.currentIndex = idx;
  updateRadarTimeLabel();
}

function radarPlayPause() {
  if (radar.playing) {
    radar.playing = false;
    if (radar.playTimer) { clearInterval(radar.playTimer); radar.playTimer = null; }
    $("btn-play").textContent = "▶";
  } else {
    radar.playing = true;
    $("btn-play").textContent = "⏸";
    radar.playTimer = setInterval(() => {
      let next = radar.currentIndex + 1;
      if (next >= radar.frames.length) next = 0;
      showRadarFrame(next);
    }, RADAR_PLAY_INTERVAL_MS);
  }
}
$("btn-play").addEventListener("click", radarPlayPause);

buildRadarFrames();

// Refresh radar frames every 5 minutes so the "now" frame stays current.
setInterval(() => {
  const wasPlaying = radar.playing;
  if (wasPlaying) radarPlayPause();
  buildRadarFrames();
  if (wasPlaying) radarPlayPause();
}, 5 * 60 * 1000);

// ─── NWS alerts (read-only display) ─────────────────────────────────
// Polls api.weather.gov every 60 seconds (slower than desktop's 30s
// since mobile is a viewer not a dispatcher) with conditional GET so
// most fetches return 304 Not Modified and consume almost no bandwidth.
const ALERT_POLL_MS = 60 * 1000;
const alertState = {
  etag: null,
  features: [],
  layer: L.layerGroup().addTo(map),
  knownIds: new Set(),
  firstFetch: true
};

async function fetchAlerts() {
  try {
    const headers = { "Accept": "application/geo+json" };
    if (alertState.etag) headers["If-None-Match"] = alertState.etag;
    const res = await fetch("https://api.weather.gov/alerts/active?status=actual", { headers });
    if (res.status === 304) return;
    if (!res.ok) return;
    const newETag = res.headers.get("ETag");
    if (newETag) alertState.etag = newETag;
    const data = await res.json();
    if (!data || !Array.isArray(data.features)) return;
    alertState.features = data.features;
    renderAlerts();
    // Audible notification on new alerts (after first fetch only, so we
    // don't beep for every alert that was already active when we loaded).
    if (!alertState.firstFetch) {
      const newOnes = data.features.filter(f => {
        const id = f.properties?.id;
        return id && !alertState.knownIds.has(id);
      });
      if (newOnes.length && audioEnabled) playAlertChime();
    }
    for (const f of data.features) {
      if (f.properties?.id) alertState.knownIds.add(f.properties.id);
    }
    alertState.firstFetch = false;
  } catch (e) {
    console.warn("[alerts] fetch failed:", e);
  }
}

// Filter alerts to those whose geometry intersects the current visible
// map bounds. Simple bbox check — no Turf.js required. As the user pans
// or zooms, the list updates automatically.
function alertsInView() {
  const bounds = map.getBounds();
  return alertState.features.filter(f => {
    if (!f.geometry) return false;
    try {
      // Walk geometry coordinates and check if ANY point falls in bounds.
      // Minor false-positive cases (alert polygon completely surrounds
      // viewport) are extremely rare for weather alerts and acceptable.
      const coords = f.geometry.coordinates;
      const stack = [coords];
      while (stack.length) {
        const c = stack.pop();
        if (Array.isArray(c[0])) {
          for (const x of c) stack.push(x);
        } else if (typeof c[0] === "number" && typeof c[1] === "number") {
          if (bounds.contains([c[1], c[0]])) return true;
        }
      }
      return false;
    } catch (_) { return false; }
  });
}

function severityClass(props) {
  const sev = (props.severity || "").toLowerCase();
  if (sev === "extreme") return "severity-extreme";
  if (sev === "severe")  return "severity-severe";
  if (sev === "moderate") return "severity-moderate";
  if (sev === "minor")   return "severity-minor";
  return "severity-unknown";
}

function renderAlerts() {
  const visible = alertsInView();
  const count = visible.length;
  const badge = $("alerts-count");
  badge.textContent = count;
  badge.classList.toggle("zero", count === 0);
  // Mark badge urgent if any alert is Extreme/Severe (warnings)
  const hasUrgent = visible.some(f => {
    const e = (f.properties?.event || "").toLowerCase();
    return /warning/.test(e) && !/statement/.test(e);
  });
  badge.classList.toggle("urgent", hasUrgent);
  // Render alert layer on map (faint outlines for context)
  alertState.layer.clearLayers();
  for (const f of visible) {
    if (!f.geometry) continue;
    try {
      L.geoJSON(f.geometry, {
        style: {
          color: hasUrgentColor(f.properties),
          weight: 1.5,
          opacity: 0.7,
          fillColor: hasUrgentColor(f.properties),
          fillOpacity: 0.1
        },
        interactive: false
      }).addTo(alertState.layer);
    } catch (_) {}
  }
  // Render alert list in bottom sheet
  const list = $("alerts-list");
  if (!count) {
    list.innerHTML = '<div class="alert-empty">No alerts in current map view</div>';
    return;
  }
  list.innerHTML = "";
  // Sort: warnings first (most urgent), then watches, then advisories, then statements
  const sorted = [...visible].sort((a, b) => sortRank(a.properties) - sortRank(b.properties));
  for (const f of sorted) {
    const p = f.properties || {};
    const card = document.createElement("div");
    card.className = "alert-card " + severityClass(p);
    const event = p.event || "Alert";
    const area = (p.areaDesc || "").split(";")[0].trim();
    const ends = p.ends || p.expires;
    const endsStr = ends ? formatTimeUntil(ends) : "";
    card.innerHTML = `
      <div class="alert-event">${escapeHtml(event)}</div>
      <div class="alert-area">${escapeHtml(area)}</div>
      <div class="alert-time">${escapeHtml(endsStr)}</div>
    `;
    card.addEventListener("click", () => {
      // Tap an alert to zoom the map to its bounds
      try {
        const layer = L.geoJSON(f.geometry);
        map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 11 });
        // Auto-collapse the sheet so the user sees the map result
        $("alerts-sheet").classList.add("collapsed");
      } catch (_) {}
    });
    list.appendChild(card);
  }
}

function hasUrgentColor(p) {
  const ev = (p?.event || "").toLowerCase();
  if (/tornado warning/.test(ev)) return "#dc2626";
  if (/severe.*warning/.test(ev) || /flash flood warning/.test(ev)) return "#ef4444";
  if (/watch/.test(ev)) return "#f97316";
  if (/advisory/.test(ev)) return "#eab308";
  return "#6b7280";
}

function sortRank(p) {
  const ev = (p?.event || "").toLowerCase();
  if (/tornado warning/.test(ev)) return 0;
  if (/flash flood warning/.test(ev)) return 1;
  if (/severe.*warning/.test(ev)) return 2;
  if (/warning/.test(ev)) return 3;
  if (/watch/.test(ev)) return 4;
  if (/advisory/.test(ev)) return 5;
  return 9;
}

function formatTimeUntil(iso) {
  try {
    const end = new Date(iso);
    const now = new Date();
    const diffMs = end - now;
    if (diffMs < 0) return "expired";
    const mins = Math.round(diffMs / 60000);
    if (mins < 60) return `until ${end.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})} (${mins}m)`;
    const hh = String(end.getHours()).padStart(2, "0");
    const mm = String(end.getMinutes()).padStart(2, "0");
    return `until ${hh}:${mm}`;
  } catch (_) { return ""; }
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Refresh visible alerts list when the user pans/zooms the map.
let renderAlertsDebounce = null;
map.on("moveend zoomend", () => {
  if (renderAlertsDebounce) clearTimeout(renderAlertsDebounce);
  renderAlertsDebounce = setTimeout(renderAlerts, 200);
});

// Initial fetch + periodic poll
fetchAlerts();
setInterval(fetchAlerts, ALERT_POLL_MS);

// ─── Bottom sheet expand/collapse ───────────────────────────────────
$("alerts-header").addEventListener("click", () => {
  $("alerts-sheet").classList.toggle("collapsed");
});

// ─── Audio (alert chime) ────────────────────────────────────────────
// iOS requires a user gesture before any audio can play. Show a small
// "tap to enable" prompt; once the user taps, we create a silent buffer
// to unlock the AudioContext and then can play tones whenever.
let audioCtx = null;
let audioEnabled = false;

function showAudioPrompt() {
  $("audio-prompt").classList.remove("hidden");
}
function hideAudioPrompt() {
  $("audio-prompt").classList.add("hidden");
}
function enableAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Play a silent buffer to unlock
    const buffer = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);
    src.start(0);
    audioEnabled = true;
    hideAudioPrompt();
    toast("Audio enabled");
  } catch (e) {
    console.warn("[audio] enable failed:", e);
    toast("Audio unavailable");
  }
}
$("audio-prompt").addEventListener("click", enableAudio);

// Quick alert chime — two short beeps on a sine wave. Not loud, not
// alarming; just a "hey, look" cue. The ntfy app on the user's phone
// is the real notification path; this is just a heads-up while the
// page is the active app.
function playAlertChime() {
  if (!audioEnabled || !audioCtx) return;
  const beep = (freq, startSec, durationSec) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.setValueAtTime(0, audioCtx.currentTime + startSec);
    gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + startSec + 0.02);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + startSec + durationSec);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + startSec);
    osc.stop(audioCtx.currentTime + startSec + durationSec);
  };
  beep(880, 0, 0.25);
  beep(660, 0.3, 0.25);
}

// Show the audio prompt on first load. Once tapped, it stays enabled
// for the rest of the session.
showAudioPrompt();

// ─── Visibility handling ────────────────────────────────────────────
// When the page is backgrounded (user switches apps or locks phone),
// browsers throttle JS heavily. We do a refresh when the user comes
// back so the radar and alerts are current.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    console.log("[mobile] page visible, refreshing");
    fetchAlerts();
    buildRadarFrames();
  }
});

console.log("StormLab Mobile v.1m initialized");
</script>
